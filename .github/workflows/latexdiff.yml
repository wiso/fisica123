name: LatexDiff

# Per ogni pull request genera un PDF con le differenze (latexdiff) rispetto
# al branch di destinazione e lo carica come artefatto "latexdiff-pdf".

on:
  pull_request:

permissions:
  contents: read

jobs:
  latexdiff:

    runs-on: ubuntu-latest

    steps:
    - name: Set up Git repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Install tools
      run: |
          sudo apt-get update
          sudo apt-get install -y latexdiff fig2dev transfig inkscape
    - name: images
      run: make images
    - name: latexdiff
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
          BASE=$(git merge-base "$BASE_SHA" HEAD)
          echo "Differenze rispetto a $BASE"
          # --flatten espande \input e \include; --math-markup=whole evita
          # di spezzare le macro all'interno delle formule
          latexdiff-vc --git --flatten --force --math-markup=whole -r "$BASE" fisica.tex
          mv "fisica-diff$BASE.tex" fisica-diff.tex
          # l'esternalizzazione di TikZ non funziona bene sul file di diff
          sed -i 's/^\\tikzexternalize/%\\tikzexternalize/' fisica-diff.tex
    - name: compile latexdiff
      uses: xu-cheng/latex-action@v2
      with:
        root_file: fisica-diff.tex
        latexmk_shell_escape: true
    - name: Upload diff PDF
      uses: actions/upload-artifact@v7
      with:
        name: latexdiff-pdf
        path: fisica-diff.pdf
